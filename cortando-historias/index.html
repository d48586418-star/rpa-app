<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cortando Histórias</title>
<meta name="description" content="O simulador de timeline: laboratório de montagem audiovisual.">
<meta name="theme-color" content="#960000">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/abertura.css">
<link rel="preload" as="image" href="assets/personas/full/historias.jpg">
</head>
<body>
<main class="stage" id="stage">
  <h1 class="sr">Cortando Histórias</h1>
  <!-- cena 3, por baixo das folhas: só aparece pelo corte -->
  <section class="base" id="base">
    <p class="sub" id="sub">O simulador de timeline</p>
    <div class="ttl" id="ttl" aria-hidden="true"><span class="ln ln1" id="ln1"></span><span class="ln ln2" id="ln2"></span></div>
    <div class="pill" id="pill" role="slider" tabindex="-1" aria-label="Arraste para iniciar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <span class="pill-t">Arraste para iniciar</span><i class="knob" id="knob"></i>
    </div>
  </section>
  <div class="peek" id="peek" aria-hidden="true"></div>
  <!-- cena 1 e 2: o papel vermelho em duas folhas (cima/baixo), cada uma com a parte ainda inteira e a parte já aberta -->
  <div class="sheets" id="sheets" aria-hidden="true">
    <div class="sh p-tw"></div><div class="sh p-to"></div><div class="sh p-bw"></div><div class="sh p-bo"></div>
  </div>
  <p class="hint" id="hint">Arraste para cortar e abrir</p>
  <div class="blade" id="blade" role="slider" tabindex="0" aria-label="Navalha: arraste para a esquerda para cortar e abrir (ou use as setas e Enter)" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <svg viewBox="0 0 50 105" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M7 6H17V3H33V6H43Q46 6 46 9V96Q46 99 43 99H33V102H17V99H7Q4 99 4 96V9Q4 6 7 6Z
      M18 13H32V17H27V22Q30 24 30 28Q30 31.5 27.5 33V38Q29 40 29 42H21Q21 40 22.5 38V33Q20 31.5 20 28Q20 24 23 22V17H18Z
      M23 46H27Q29 47.5 29 52.5Q29 57.5 27 59H23Q21 57.5 21 52.5Q21 47.5 23 46Z
      M21 63H29Q29 65 27.5 67V72Q30 74 30 77.5Q30 81 27 83V88H32V92H18V88H23V83Q20 81 20 77.5Q20 74 22.5 72V67Q21 65 21 63Z"/></svg>
  </div>
  <a class="entrar-link" id="entrar-link" href="lab.html#/escolher" hidden>Entrar</a>
  <p class="cred">Site desenvolvido por Débora Augusta Alves Santos e por inteligência artificial (Claude, Anthropic)</p>
</main>
<noscript><style>.sheets,.hint,.blade{display:none}.base{opacity:1!important;visibility:visible!important;background:#960000}.sub,.pill,.cred{display:none}.stage{display:grid;place-content:center;gap:28px}.sr{position:static;width:auto;height:auto;clip:auto;font:700 clamp(3rem,16vw,9rem)/.9 "Helvetica Neue",Helvetica,Arial,sans-serif;letter-spacing:-.07em;color:#fff;text-align:center}.ns{color:#fff;font:400 1.1rem Helvetica,Arial,sans-serif;text-align:center}</style><a class="ns" href="lab.html#/escolher">Entrar no laboratório</a></noscript>
<script src="js/abertura.js"></script>
</body>
</html>
