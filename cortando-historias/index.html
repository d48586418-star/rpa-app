<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cortando Histórias</title>
<meta name="description" content="Simulador de timeline: laboratório de montagem audiovisual.">
<meta name="theme-color" content="#a81020">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/abertura.css">
</head>
<body>
<main>
 <div class="stage" id="stage">
  <h1 class="sr">Cortando Histórias</h1>
  <div class="cam" id="cam">
    <div class="deep">
      <div class="reveal">
        <p class="txt" id="txt" aria-hidden="true"><span class="l"><span class="w w1">Cortando</span></span><span class="l"><span class="w w2">Histórias</span></span></p>
        <a class="go" id="entrar" href="lab.html#/boas-vindas">Iniciar jornada</a>
      </div>
    </div>
  </div>
  <div class="rip" id="rip" aria-hidden="true">
    <div class="rip-full"></div>
    <div class="half top"><div class="part torn"><div class="sheet"></div></div><div class="part whole"><div class="sheet"></div></div></div>
    <div class="half bot"><div class="part torn"><div class="sheet"></div></div><div class="part whole"><div class="sheet"></div></div></div>
    <i class="pull pl"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></i>
    <i class="pull pr"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></i>
  </div>
  <button type="button" class="instr" id="instr"><span>Puxe pelo meio para abrir</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8l-4 4 4 4M17 8l4 4-4 4M3 12h18"/></svg></button>
 </div>
</main>
<script src="js/abertura.js"></script>
</body>
</html>
